<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Navigating application fixture</title>
  </head>
  <body>
    <main>
      <h1>Junior Data Analyst</h1>
      <p>Karoo Analytics, Pretoria</p>
      <form id="apply" action="thanks.html" method="get">
        <label for="given">Given name</label>
        <input id="given" name="given" autocomplete="given-name" />
        <label for="family">Family name</label>
        <input id="family" name="family" autocomplete="family-name" />
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
